[project.optional-dependencies]
tus = ["tuspy>=1.1.0,<2"]

[tool.setuptools.package-data]
harbor_client = ["py.typed", "_openapi.json.gz", "**/*.pyi"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harbor-framework-client"
version = "0.1.1"
description = """To use this version of the API, send the `Harbor-API-Version: 2026-09-10.preview` header with every request. This is the latest version."""
readme = "PyPI_README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.14.0,<3",
    "httpx>=0.27.0",
    "jsonschema>=4.23.0"
]


[project.urls]
Repository = "https://github.com/harbor-framework/harbor-client"

