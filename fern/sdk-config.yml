schemaVersion: sdk-config/v1
sdkVersion: 0.1.0
sdkName: HarborAPIClient
source:
  specs:
    - id: openapi
      type: openapi
      path: ./openapi.json
      overrides:
        - ./overrides.yml
  apiImportSettings:
    respectNullableSchemas: true
    coerceEnumsToLiterals: true
    wrapReferencesToNullableInOptional: false
    discriminatedUnionV2: true
    undiscriminatedUnionsWithLiterals: true
api:
  baseUrl: https://api.harborframework.com/functions/v1/api
  headers:
    - name: harborApiVersion
client:
  responseValidation: true
  retry:
    methods: [GET, HEAD, OPTIONS]
replay:
  enabled: true
generation:
  naming:
    clientName: BaseHarborAPIClient
    exportedClientName: HarborAPIClient
    environmentTypeName: HarborAPIClientEnvironment
  serialization:
    additionalProperties: language-default
# Python 6.17.0 accepts these README settings but ignores them; retain the
# owned README until an actual regeneration reproduces it.
docs:
  readme:
    apiName: Harbor API
    introduction: |
      Typed synchronous and asynchronous clients for the Harbor API.

      ```python
      from harbor_client import HarborAPIClient

      with HarborAPIClient(token="your-api-key") as client:
          for job in client.jobs.list():
              print(job.id, job.name)
      ```

      ```python
      from harbor_client import AsyncHarborAPIClient

      import asyncio

      async def main():
          async with AsyncHarborAPIClient(token="your-api-key") as client:
              async for job in client.jobs.list():
                  print(job.id, job.name)

      asyncio.run(main())
      ```
    defaultEndpoint:
      method: GET
      path: /v1/jobs
    customSections:
      - title: Client lifecycle and validation
        content: |
          Use `HarborAPIClient` or `AsyncHarborAPIClient` from `harbor_client`.
          Both use one reusable connection pool and enforce the selected OpenAPI
          contract. The API version defaults to the contract used to generate this SDK.
          Use a context manager, or call `close()` / `aclose()` when finished.

          The older `harbor_client.validation.sync_client` and `async_client`
          imports remain compatibility shims for existing integrations.
      - title: Pagination
        content: |
          Iterate list results directly to follow opaque cursors automatically.
          Use `iter_pages()` for one page at a time. A pager is single-use;
          call the resource method again to start a new iteration.
      - title: Signed storage transfers
        content: |
          Install `harbor-framework-client[tus]` for resumable uploads. Use
          `client.transfers` for signed upload, download and copy workflows.
          Storage transfers do not forward Harbor credentials to signed URLs.
targets:
  - language: python
    generatorVersion: 6.17.0
    generation:
      # Accepted but not emitted by Python 6.17.0; package checks guard the
      # existing Replay metadata until Fern implements these settings.
      pythonVersion: ">=3.12"
      pydanticVersion: ">=2.14.0,<3"
      client:
        fileName: base_client.py
        exportedFileName: client.py
      extras:
        tus: [tuspy]
      additionalInitExports:
        - from: validation
          imports: [ContractError]
        - from: transfers
          imports: [StorageTransferError, UploadFile]
    output:
      delivery: github
      github:
        repository: harbor-framework/harbor-client
        mode: pull-request
        branch: main
        workflows: false
    package:
      packageName: harbor-framework-client
      # Emit [project.urls] in every generation mode, not only GitHub delivery,
      # so preview and published generations agree for Replay's 3-way merge.
      repository: https://github.com/harbor-framework/harbor-client
      moduleName: harbor_client
      description: Typed synchronous and asynchronous clients for the Harbor API.
      extraDependencies:
        - name: httpx
          version: ">=0.27.0"
        - name: jsonschema
          version: ">=4.23.0"
        - name: tuspy
          version: ">=1.1.0,<2"
          optional: true
