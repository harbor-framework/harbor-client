name: SDK checks
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reject unresolved native Replay patches
        run: |
          node --input-type=module -e 'import { status } from "@fern-api/replay"; const s=status(process.cwd()); if (!s.initialized || s.unresolvedCount > 0) process.exit(1);'
      - run: uv venv
      - run: uv pip install -r requirements-dev.txt '.[tus]'
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/ty check
      - run: .venv/bin/pytest tests
      - run: uv build
      - name: Verify the built distribution independently
        run: |
          uv venv wheel-check
          uv pip install --python wheel-check/bin/python dist/*.whl
          cd "${RUNNER_TEMP}"
          "${GITHUB_WORKSPACE}/wheel-check/bin/python" - <<'PYCODE'
          from importlib.resources import files
          from harbor_client import HarborAPIClient, AsyncHarborAPIClient
          package = files("harbor_client")
          for name in ("__init__.pyi", "types/__init__.pyi", "_openapi.json.gz", "py.typed"):
              if not package.joinpath(name).is_file():
                  raise RuntimeError(f"Missing SDK package data: {name}")
          PYCODE
