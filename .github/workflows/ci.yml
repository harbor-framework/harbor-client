name: SDK checks
on:
  workflow_call:
  pull_request:
  workflow_dispatch:
    inputs:
      replay_base:
        description: Base branch whose Replay patches this ref must keep, such as a regeneration PR's base
        type: string
        default: ""
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reject unresolved native Replay patches
        run: |
          node --input-type=module -e 'import { status } from "@fern-api/replay"; const s=status(process.cwd()); if (!s.initialized || s.unresolvedCount > 0) process.exit(1);'
      - name: Reject Replay patches dropped or skipped since the base branch
        env:
          REPLAY_BASE: ${{ github.base_ref || inputs.replay_base }}
        run: |
          set -euo pipefail
          if [[ -z "$REPLAY_BASE" ]]; then
            exit 0
          fi
          git fetch --no-tags origin "refs/heads/$REPLAY_BASE"
          base=$(git merge-base FETCH_HEAD HEAD)
          patch_ids() { git show "$1:.fern/replay.lock" | sed -n 's/^  - id: //p' | sort; }
          dropped=$(comm -23 <(patch_ids "$base") <(patch_ids HEAD))
          if [[ -n "$dropped" ]]; then
            echo "::error::Replay patches on $REPLAY_BASE are missing from this branch: $(echo $dropped). Restore them, or retire an obsolete patch deliberately with Fern's Replay tools."
            exit 1
          fi
          if git log --format=%s "$base..HEAD" | grep -F '(replay skipped)'; then
            echo "::error::Fern skipped Replay for this generation, so no customizations were applied."
            exit 1
          fi
      - run: uv venv
      - run: uv pip install -r requirements-dev.txt '.[tus]'
      - run: .venv/bin/ruff check . src/harbor_client/validation.py src/harbor_client/transfers.py src/harbor_client/client.py
      - run: .venv/bin/ruff format --check . src/harbor_client/validation.py src/harbor_client/transfers.py src/harbor_client/client.py
      - run: .venv/bin/ty check
      - run: .venv/bin/pytest tests
      - run: uv build
      - name: Verify the built distribution independently
        run: |
          uv venv wheel-check
          wheels=(dist/*.whl)
          uv pip install --python wheel-check/bin/python -r requirements-dev.txt "${wheels[0]}[tus]"
          cd "${RUNNER_TEMP}"
          "${GITHUB_WORKSPACE}/wheel-check/bin/python" - <<'PYCODE'
          from importlib.resources import files
          from harbor_client import HarborAPIClient, AsyncHarborAPIClient, ContractError, UploadFile, StorageTransferError
          from importlib.metadata import metadata
          if metadata("harbor-framework-client")["Requires-Python"] != ">=3.12":
              raise RuntimeError("Generated packaging lost the minimum Python requirement")
          package = files("harbor_client")
          for name in ("__init__.pyi", "types/__init__.pyi", "_openapi.json.gz", "py.typed"):
              if not package.joinpath(name).is_file():
                  raise RuntimeError(f"Missing SDK package data: {name}")
          exports = package.joinpath("__init__.pyi").read_text()
          for name in ("HarborAPIClient", "AsyncHarborAPIClient", "ContractError", "UploadFile", "StorageTransferError", "HarborAPIClientEnvironment"):
              if f" as {name}\n" not in exports:
                  raise RuntimeError(f"Missing typed SDK export: {name}")
          PYCODE
          "${GITHUB_WORKSPACE}/wheel-check/bin/python" -m pytest "${GITHUB_WORKSPACE}/tests" -o pythonpath= -q
