name: Generate SDK
on:
  workflow_dispatch:
    inputs:
      spec_ref:
        description: SDK Git ref containing a candidate fern/openapi.json; no API deployment required
        type: string
        default: ""
      spec_url:
        description: HTTPS OpenAPI document URL; mutually exclusive with spec_ref
        type: string
        default: ""
      sdk_branch:
        description: SDK branch to receive the generated update PR
        type: string
        default: main
      sdk_version:
        description: Exact SDK version, such as 1.2.3; empty keeps the SDK branch's pyproject.toml version
        type: string
        default: ""
      bump:
        description: Raise the SDK branch's version for a release; leave sdk_version empty
        type: choice
        options: [none, patch, minor]
        default: none
      force:
        description: Regenerate even when the API document is unchanged
        type: boolean
        default: false
  # Daily check of the deployed API document; does nothing when it is unchanged.
  # Fern's sync-openapi action needs generators.yml, which this sdk-config setup does not use.
  schedule:
    - cron: "17 8 * * *"
  push:
    branches: [main]
    paths:
      - "fern/**"
      # Merging a regeneration PR updates the document; that must not regenerate again.
      - "!fern/openapi.json"
      - ".github/workflows/generate.yml"
permissions:
  contents: read
concurrency:
  group: sdk-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      API_SPEC_URL: ${{ vars.OPENAPI_SPEC_URL || 'https://api.harborframework.com/functions/v1/api/v1/2026-09-10.preview/openapi.json' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
      - uses: fern-api/setup-fern-cli@d07601425e9c9ede8745d71ca75c4c462d98755d # v1
        with:
          version: 5.199.0
      - name: Select the SDK destination branch
        env:
          SDK_BRANCH: ${{ inputs.sdk_branch || 'main' }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$SDK_BRANCH"
          git ls-remote --exit-code origin "refs/heads/$SDK_BRANCH" > /dev/null
          uv run --no-project --with PyYAML==6.0.2 python - <<'PYCODE'
          import os
          from pathlib import Path
          import yaml
          path = Path("fern/sdk-config.yml")
          config = yaml.safe_load(path.read_text())
          for target in config["targets"]:
              target["output"]["github"]["branch"] = os.environ["SDK_BRANCH"]
          path.write_text(yaml.safe_dump(config, sort_keys=False))
          PYCODE
      - name: Choose the SDK version
        id: version
        env:
          SDK_BRANCH: ${{ inputs.sdk_branch || 'main' }}
          SDK_VERSION: ${{ inputs.sdk_version }}
          BUMP: ${{ inputs.bump || 'none' }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$SDK_BRANCH:refs/remotes/origin/$SDK_BRANCH"
          git show "origin/$SDK_BRANCH:pyproject.toml" > "$RUNNER_TEMP/pyproject.toml"
          uv run --no-project python - <<'PYCODE'
          import os
          import re
          import sys
          import tomllib
          with open(os.path.join(os.environ["RUNNER_TEMP"], "pyproject.toml"), "rb") as file:
              current = tomllib.load(file)["project"]["version"]
          requested, bump = os.environ["SDK_VERSION"], os.environ["BUMP"]
          if requested and bump != "none":
              print("::error::Set sdk_version or bump, not both.")
              sys.exit(1)
          version = requested or current
          if bump != "none":
              major, minor, patch = map(int, current.split("."))
              version = f"{major}.{minor + 1}.0" if bump == "minor" else f"{major}.{minor}.{patch + 1}"
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              print(f"::error::The SDK version must look like 1.2.3, not {version!r}.")
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
              print(f"changed={str(version != current).lower()}", file=output)
          print(f"SDK version: {current} -> {version}")
          PYCODE
      - name: Check that Replay starts from the latest generation
        env:
          SDK_BRANCH: ${{ inputs.sdk_branch || 'main' }}
        run: |
          set -euo pipefail
          # Replay takes the newest generation commit on the branch's first-parent
          # history as its base. A regeneration PR landed with a merge commit hides
          # its generation on the second parent, so Replay falls back to an older
          # base and silently drops customizations made since then.
          uv run --no-project python - <<'PYCODE'
          import os
          import subprocess
          import sys
          branch = "origin/" + os.environ["SDK_BRANCH"]
          def log(*args):
              out = subprocess.run(
                  ["git", "log", "--format=%H%x00%an%x00%ae%x00%s", *args],
                  check=True, capture_output=True, text=True,
              ).stdout
              return [line.split("\0") for line in out.splitlines()]
          # Mirrors isGenerationBoundary in @fern-api/replay.
          def is_generation(commit):
              _, name, email, subject = commit
              bot = name not in ("fern-support", "Fern Support") and (
                  name == "fern-api"
                  or email == "115122769+fern-api[bot]@users.noreply.github.com"
              )
              marker = (
                  subject.startswith(("[fern-generated]", "[fern-replay]", "SDK Generation"))
                  or "Generated by Fern" in subject
                  or "\N{ROBOT FACE} Generated with Fern" in subject
              )
              return (bot and not subject.startswith("[fern-autoversion]")) or marker
          base = next((c for c in log("--first-parent", branch) if is_generation(c)), None)
          if base is None:
              print(f"::error::{branch} has no Fern generation commit on its first-parent history.")
              sys.exit(1)
          hidden = [c for c in log("--no-merges", f"{base[0]}..{branch}") if is_generation(c)]
          if hidden:
              print(
                  f"::error::Replay would start from {base[0][:7]} ({base[3]}), but {branch} has the "
                  f"newer generation {hidden[0][0][:7]} ({hidden[0][3]}) behind a merge commit, so "
                  "Replay would drop customizations made since then. Land regeneration PRs with "
                  "Rebase and merge, and fix this branch's history before regenerating."
              )
              sys.exit(1)
          print(f"Replay starts from {base[0][:7]}: {base[3]}")
          PYCODE
      - name: Read the selected API document
        id: spec
        env:
          # A new version needs a generation even when the API document is unchanged.
          FORCE: ${{ inputs.force || github.event_name == 'push' || steps.version.outputs.changed == 'true' }}
          SPEC_REF: ${{ inputs.spec_ref }}
          SPEC_URL: ${{ inputs.spec_url }}
        run: |
          set -euo pipefail
          if [[ -n "$SPEC_REF" && -n "$SPEC_URL" ]]; then
            echo "::error::Choose spec_ref or spec_url, not both."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            # Configuration changes regenerate the committed contract, not the deployed one.
            cp fern/openapi.json "$RUNNER_TEMP/openapi.json"
          elif [[ -n "$SPEC_REF" ]]; then
            git fetch --no-tags -- origin "$SPEC_REF"
            git show FETCH_HEAD:fern/openapi.json > "$RUNNER_TEMP/openapi.json"
          else
            source_url="${SPEC_URL:-$API_SPEC_URL}"
            if [[ "$source_url" != https://* ]]; then
              echo "::error::The API document URL must use HTTPS."
              exit 1
            fi
            curl --fail --silent --show-error --retry 3 "$source_url" -o "$RUNNER_TEMP/openapi.json"
          fi
          jq -e '(.openapi | type == "string") and (.paths | type == "object" and length > 0)' "$RUNNER_TEMP/openapi.json" > /dev/null
          jq -Sc . fern/openapi.json > "$RUNNER_TEMP/previous.canonical.json"
          jq -Sc . "$RUNNER_TEMP/openapi.json" > "$RUNNER_TEMP/next.canonical.json"
          if cmp -s "$RUNNER_TEMP/previous.canonical.json" "$RUNNER_TEMP/next.canonical.json" && [[ "$FORCE" != true ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            jq . "$RUNNER_TEMP/openapi.json" > fern/openapi.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate and replay through Fern's native GitHub publisher
        if: steps.spec.outputs.changed == 'true'
        id: fern
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
          SDK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! fern generate --target python --version "$SDK_VERSION" --force > "$RUNNER_TEMP/fern.log" 2>&1; then
            echo "::error::Fern generation failed. Inspect the authenticated Fern build; private build logs were not uploaded."
            exit 1
          fi
          pr_url=$(grep -Eo 'https://github.com/harbor-framework/harbor-client/pull/[0-9]+' "$RUNNER_TEMP/fern.log" | tail -1 || true)
          if [[ -z "$pr_url" ]]; then
            echo "::error::Fern did not return a regeneration PR; the contract snapshot has not been updated."
            exit 1
          fi
          # Fern deduplicates builds by an idempotency key over the inputs, so identical
          # inputs return the earlier build's PR instead of generating again.
          pr_state=$(gh pr view "$pr_url" --json state --jq .state)
          case "$pr_state" in
            OPEN)
              echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
              ;;
            MERGED)
              echo "::notice::Inputs match an earlier Fern build, already merged in $pr_url; nothing to regenerate."
              ;;
            *)
              echo "::error::Inputs match an earlier Fern build whose PR $pr_url is $pr_state. Reopen it, or change the inputs to regenerate."
              exit 1
              ;;
          esac
      - name: Attach the exact validation contract to Fern's PR
        if: steps.spec.outputs.changed == 'true' && steps.fern.outputs.pr_url != ''
        env:
          PR_URL: ${{ steps.fern.outputs.pr_url }}
          SDK_BRANCH: ${{ inputs.sdk_branch || 'main' }}
        run: |
          set -euo pipefail
          cp fern/openapi.json "$RUNNER_TEMP/generated-openapi.json"
          git restore fern/openapi.json fern/sdk-config.yml
          gh pr checkout "$PR_URL"
          cp "$RUNNER_TEMP/generated-openapi.json" fern/openapi.json
          gzip -n -c fern/openapi.json > src/harbor_client/_openapi.json.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fern/openapi.json src/harbor_client/_openapi.json.gz
          if ! git diff --cached --quiet; then
            git commit -m "Sync the generated SDK's validation contract"
            git push
          fi
          # Token-authenticated pushes do not trigger another pull_request run.
          gh workflow run ci.yml --ref "$(git branch --show-current)" -f replay_base="$SDK_BRANCH"
          echo "SDK update: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
