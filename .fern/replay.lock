      +
      +def _snake(name):
      +    return re.sub(r"([a-z0-9])([A-Z])", r"\1_\2", name).lower()
      +
      +
      +def _schema(path, verb="get"):
      +    return SPEC["paths"][path][verb]["responses"]["200"]["content"]["application/json"][
      +        "schema"
      +    ]
