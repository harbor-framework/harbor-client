      +def _nullable(schema):
      +    if "$ref" in schema:
      +        return _nullable(
      +            SPEC["components"]["schemas"][schema["$ref"].rsplit("/", 1)[-1]]
      +        )
      +    return schema.get("type") == "null" or any(
      +        _nullable(branch) for branch in schema.get("anyOf", [])
      +    )
